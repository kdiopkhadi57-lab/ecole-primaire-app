services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    volumes:
      - backend-data:/app/data
    networks:
      - school-net

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - school-net

networks:
  school-net:
    driver: bridge

volumes:
  backend-data:
